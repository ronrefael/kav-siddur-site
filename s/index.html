<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kav Siddur</title>
<meta name="description" content="Shared from Kav Siddur — a siddur with word-by-word Hebrew, transliteration and translation.">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta property="og:title" content="Kav Siddur">
<meta property="og:description" content="Shared from Kav Siddur — word-by-word Hebrew, transliteration and translation.">
<meta name="apple-itunes-app" content="app-id=6759996061">
<script>
  // Hand the exact shared link to the app through Safari's Smart App Banner
  // ("Open" when installed). Added before <body> so Safari sees it at load.
  (function () {
    try {
      var m = document.querySelector('meta[name="apple-itunes-app"]');
      m.setAttribute("content", "app-id=6759996061, app-argument=" + location.href);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --ground: #F7F1E6; --card: #FBF7EF; --ink: #2A2118; --ink-2: #5C4F40; --ink-3: #8A7B69;
    --gold: #B8862B; --gold-deep: #8F6414; --rule: rgba(42,33,24,.14); --btn-ink: #FFFDF8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #16120E; --card: #1D1711; --ink: #EFE6D6; --ink-2: #C9BBA6; --ink-3: #8F8170;
      --gold: #D4A24A; --gold-deep: #E7BE6C; --rule: rgba(239,230,214,.14); --btn-ink: #16120E;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    background: var(--ground); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 100%; max-width: 420px; text-align: center;
    background: var(--card); border: 1px solid var(--rule); border-radius: 20px;
    padding: 36px 28px 28px;
  }
  .mark { font-family: "Times New Roman", serif; font-size: 34px; line-height: 1; color: var(--gold); margin: 0; }
  .brand { font-size: 11px; letter-spacing: .22em; color: var(--ink-3); margin: 8px 0 26px; }
  .rule { height: 1px; width: 72px; margin: 0 auto 26px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-deep); margin: 0 0 10px; font-weight: 600; }
  .he { font-family: "Times New Roman", serif; font-size: 30px; line-height: 1.3; margin: 0 0 4px; direction: rtl; }
  .title { font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-style: italic; margin: 0 0 6px; }
  .sub { color: var(--ink-2); font-size: 15px; margin: 0 0 28px; }
  .btn {
    display: block; width: 100%; padding: 14px 18px; border-radius: 12px; text-decoration: none;
    font-weight: 600; font-size: 16px; margin: 0 0 10px;
  }
  .btn-primary { background: var(--gold-deep); color: var(--btn-ink); }
  .btn-secondary { border: 1px solid var(--rule); color: var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .foot { font-size: 12.5px; color: var(--ink-3); margin: 18px 0 0; }
  .foot a { color: var(--ink-3); }
</style>
</head>
<body>
<main class="card">
  <p class="mark" lang="he">קו</p>
  <p class="brand">KAV SIDDUR</p>
  <div class="rule"></div>
  <p class="eyebrow" id="eyebrow">Shared with you</p>
  <p class="he" id="he" lang="he" hidden></p>
  <p class="title" id="title">A page from the siddur</p>
  <p class="sub" id="sub">Open it in Kav Siddur — word-by-word Hebrew, transliteration and translation, offline.</p>
  <a class="btn btn-primary" id="open" href="kavsiddur:///">Open in Kav Siddur</a>
  <a class="btn btn-secondary" id="store" href="https://apps.apple.com/app/id6759996061">Get Kav Siddur on the App Store</a>
  <p class="foot">No account, no tracking. <a href="../support.html">Support</a> · <a href="../privacy.html">Privacy</a></p>
</main>
<script>
  // Everything here is read from the link and written with textContent only.
  // The app validates the query again before acting on it.
  (function () {
    var q = new URLSearchParams(location.search);
    var $ = function (id) { return document.getElementById(id); };

    // The app's own scheme, carrying the identical query (see
    // apps/mobile/src/links/shareLinks.ts). Pray For links keep their params.
    $("open").setAttribute("href", "kavsiddur:///" + location.search);

    // Mirrors toHebrewNumeral in apps/mobile/src/utils/gematria.ts: 15 → ט״ו,
    // 16 → ט״ז, geresh on one letter (א׳), gershayim before the last (כ״ג).
    function hebrewNumeral(n) {
      var ones = ["", "א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט"];
      var tens = ["", "י", "כ", "ל", "מ", "נ", "ס", "ע", "פ", "צ"];
      var h = n >= 100 ? "ק" : "";
      var r = n % 100;
      var t = tens[Math.floor(r / 10)];
      var o = ones[r % 10];
      if (r === 15) { t = "ט"; o = "ו"; }
      if (r === 16) { t = "ט"; o = "ז"; }
      var letters = h + t + o;
      if (letters.length === 1) return letters + "׳";
      return letters.slice(0, -1) + "״" + letters.slice(-1);
    }

    function titleCase(slug) {
      var words = slug.split("-");
      var out = [];
      for (var i = 0; i < words.length; i++) {
        if (words[i] === "edot" && words[i + 1] === "hamizrach") { out.push("Edot HaMizrach"); i++; continue; }
        out.push(words[i].charAt(0).toUpperCase() + words[i].slice(1));
      }
      return out.join(" ");
    }

    function show(eyebrow, he, title, sub) {
      $("eyebrow").textContent = eyebrow;
      if (he) { $("he").textContent = he; $("he").hidden = false; }
      $("title").textContent = title;
      if (sub) $("sub").textContent = sub;
      document.title = title + " · Kav Siddur";
    }

    var ps = q.get("ps");
    var t = q.get("t");
    var name = q.get("prayForName");

    if (ps && /^\d{1,3}$/.test(ps) && +ps >= 1 && +ps <= 150) {
      show("Tehillim", "תהלים " + hebrewNumeral(+ps), "Psalm " + (+ps), null);
    } else if (t && /^[a-z0-9][a-z0-9_\/-]*$/.test(t) && t.length <= 120) {
      var last = t.split("/").pop();
      show(t.indexOf("prayers/") === 0 ? "From the siddur" : "Shared with you", null, titleCase(last), null);
    } else if (name && name.length <= 80) {
      show("Hold in prayer", name.trim(), "A name shared with you",
        "Open Kav Siddur to keep this name in your prayers.");
    }
  })();
</script>
</body>
</html>
